{% extends 'mask/base.html' %}

{% block content %}
<h1>Каталог масок</h1>

<!-- Форма поиска и фильтрации (Задание 4) -->
<form method="get" style="margin-bottom: 20px;">
    <input type="text" name="q" placeholder="Поиск по названию..." value="{{ request.GET.q }}">
    
    <select name="category">
        <option value="">Все категории</option>
        {% for cat in categories %}
            <option value="{{ cat.id }}">{{ cat.name }}</option>
        {% endfor %}
    </select>
    
    <button type="submit">Применить</button>
</form>

<div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;">
    {% for product in products %}
    <div style="border: 1px solid #ddd; padding: 15px;">
        <h3>{{ product.name }}</h3>
        <p>Цена: {{ product.price }} руб.</p>
        <a href="{% url 'mask:product_detail' product.pk %}">Смотреть детали</a>
        
        <form action="{% url 'mask:add_to_cart' product.id %}" method="post" style="margin-top: 10px;">
            {% csrf_token %}
            <button type="submit">Добавить в корзину</button>
        </form>
    </div>
    {% endfor %}
</div>
{% endblock %}
